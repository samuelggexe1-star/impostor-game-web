<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego del Impostor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <h1>🎭 Juego del Impostor</h1>

    <!-- Pantalla inicio -->
    <div id="pantalla-inicio">
      <input id="nombre" placeholder="Tu nombre">
      <input id="sala" placeholder="Código de sala">
      <input id="prompt" placeholder="Prompt para la ronda (host)">
      <button id="btn-unirse">Unirse</button>
      <button id="btn-prompt">Enviar prompt y nueva ronda</button>
    </div>

    <!-- Pantalla juego -->
    <div id="pantalla-juego" class="oculto">
      <h2 id="mensaje-rol"></h2>
      <button id="btn-mostrar">Ver palabra</button>
      <div id="palabra" class="oculto"></div>
      <button id="btn-ocultar" class="oculto">Ocultar</button>
      <button id="btn-nueva" class="oculto">Nueva ronda</button>
    </div>

    <div id="jugadores"></div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
